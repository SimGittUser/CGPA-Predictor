<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f3ec" />
    <title>CU Grade Predictor</title>
    <script>
      // Set the saved theme before anything paints, so there's no flash of the wrong one.
      try {
        var saved = JSON.parse(localStorage.getItem('cu-grade-predictor:v1') || 'null');
        var t = saved && saved.settings && saved.settings.theme;
        if (t === 'dark') t = 'space';
        if (!t || t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'space' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Space+Grotesk:wght@500;600;700&display=swap"
    />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2322c55e'/><text x='16' y='22' font-size='16' font-family='system-ui' font-weight='700' text-anchor='middle' fill='white'>A+</text></svg>" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
